<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuccessLabs Hero Example</title><link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font-family:Comfortaa,system-ui,sans-serif;margin:0;background:#f6fbff;color:#173B63}.shell{max-width:1100px;margin:40px auto;padding:20px}.hero{background:linear-gradient(110deg,#329ED8 0%,#D7F1FF 100%);padding:44px;border-radius:24px}h1{font-size:clamp(25px,4vw,46px)}p{color:#334155}.cards{display:flex;flex-wrap:wrap;gap:12px}.card{background:rgba(255,255,255,.94);padding:18px;border-radius:14px;border:1px solid #dde5ec;min-width:130px;box-shadow:0 8px 24px #14324b14}button{background:#1263B4;border:0;color:white;padding:13px 22px;font:inherit;border-radius:10px;cursor:pointer}button:focus-visible{outline:3px solid orange;outline-offset:2px}footer{text-align:center;margin:30px;color:#506478}</style></head><body><div class="shell"><section class="hero"><small>✧ DISCOVER · UNDERSTAND · ENVISION</small><h1>Product Innovation Lab</h1><p>Explore enterprise innovation through bright, focused, human-centered learning.</p><div class="cards"><div class="card">8 Rules</div><div class="card">11 Sectors</div><div class="card">20 FAQs</div></div><p><button type="button">Explore the Lab</button></p></section><footer>Architecting experiences for a better world.</footer></div></body></html>
